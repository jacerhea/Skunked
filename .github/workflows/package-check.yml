name: Verify packages
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify package contents and consumer
        shell: pwsh
        run: ./scripts/Verify-Packages.ps1
