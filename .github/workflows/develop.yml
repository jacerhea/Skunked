name: Build and test
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Show selected SDK
        run: dotnet --version
      - name: Restore solution
        run: dotnet restore Skunked.sln
      - name: Build solution
        run: dotnet build Skunked.sln --configuration Release --no-restore
      - name: Core unit tests
        run: dotnet test test/Skunked.UnitTest/Skunked.UnitTest.csproj --configuration Release --no-build
      - name: Full-game system tests
        run: dotnet test test/Skunked.Standard.Test.System/Skunked.Test.System.csproj --configuration Release --no-build
      - name: AI tests
        run: dotnet test test/Skunked.AI.Tests/Skunked.AI.Tests.fsproj --configuration Release --no-build
      - name: Run getting-started example
        run: dotnet run --project examples/GettingStarted/GettingStarted.csproj --configuration Release
      - name: Verify README example
        shell: pwsh
        run: ./scripts/Verify-Example.ps1
