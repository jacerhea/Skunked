name: Supported frameworks
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Run core tests on ${{ matrix.framework }}
        run: dotnet test test/Skunked.UnitTest/Skunked.UnitTest.csproj --configuration Release --framework ${{ matrix.framework }}
